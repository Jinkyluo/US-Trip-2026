<style id="expense-module-styles">
.mode-tabs{display:flex;gap:34px;align-items:flex-end;border-bottom:1px solid var(--line);margin-bottom:19px}

.expense-view{border-top:1px solid var(--line);margin-top:13px;padding-top:25px}

.expense-category[data-category="住宿"]{background:#f7ece2;color:#9a6333}.expense-category[data-category="交通"]{background:#eaf1f6;color:#55758c}.expense-category[data-category="餐饮"]{background:#eef3e9;color:#667f54}.expense-category[data-category="购物"]{background:#f3eaf3;color:#866286}.expense-category[data-category="其他"]{background:#efefed;color:#6f7471}

.expense-empty{padding:30px 0;text-align:center;color:var(--muted);font-size:13px}

.strip.is-hidden,.expense-view.bill-open>.expense-actions,.expense-view.bill-open>.expense-day-card,.expense-view.bill-open>.trip-total-card{display:none!important}
.bill-view{border-top:1px solid var(--line);padding-top:18px}

.bill-receipt:before{top:12px}.bill-receipt:after{bottom:12px}
.bill-top{text-align:center;padding:14px 0 16px;border-bottom:1px dashed #cfd6d0}

.bill-section{border-top:1px dashed #d6dcd7;padding:14px 0}
.bill-section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px;font-size:13px;font-weight:800}
.bill-section-title strong{font-variant-numeric:tabular-nums}
.bill-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:8px 0;font-size:13px}
.bill-line-main{min-width:0}.bill-line-name{white-space:normal;word-break:break-word}.bill-line-meta{margin-top:3px;color:var(--muted);font-size:11px}
.bill-line-cost{font-variant-numeric:tabular-nums;white-space:nowrap}
.bill-empty{padding:30px 0;text-align:center;color:var(--muted);font-size:13px;border-top:1px dashed #d6dcd7}
.bill-footer{text-align:center;border-top:1px dashed #cfd6d0;padding-top:14px;color:var(--muted);font-size:11px;line-height:1.6}
.expense-modal-backdrop{position:fixed;inset:0;background:rgba(15,25,23,.42);display:grid;place-items:center;padding:20px;z-index:99}
.expense-modal-backdrop.is-hidden,.expense-view.is-hidden,.shell.is-hidden,.bill-view.is-hidden{display:none!important}
.expense-modal{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}
.expense-modal h3{margin:0 0 6px;font-size:22px}.expense-modal p{margin:0 0 16px;font-size:13px;color:var(--muted)}
.expense-form{display:grid;gap:12px}.expense-form label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.expense-form input,.expense-form select{font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff;color:var(--ink)}
.expense-modal-actions{display:flex;gap:8px;margin-top:18px}.expense-modal-actions button{flex:1}
.expense-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--dark);color:#fff;border-radius:999px;padding:10px 15px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:120}
.expense-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:780px){
  .mode-tabs{gap:26px;margin-bottom:17px}.mode-tab{font-size:27px;padding-bottom:15px}

  .expense-row.editing{grid-template-columns:28px minmax(0,1fr) 86px 88px 32px;gap:7px}.expense-row.editing .expense-input{font-size:14px;padding:9px 8px}
  .trip-total-card{padding:17px}.trip-total-value{font-size:25px}.bill-toolbar{display:grid;grid-template-columns:1fr}.bill-receipt{padding:19px 17px}.bill-total-line strong{font-size:29px}.bill-line{gap:10px}
}
</style>

async function initialSync(){if(syncing)return;syncing=true;try{await migrateLocalOnce();await fetchCloud(false)}catch(e){cache();toast('云端暂时无法连接，已使用本机缓存')}finally{syncing=false}}
function expenseRows(){const rows=[];DAYS.forEach((d,dayIndex)=>{(Array.isArray(expenses[d.day])?expenses[d.day]:[]).forEach((x,i)=>{const name=String(x.name||'未命名项目').trim()||'未命名项目';rows.push({day:d.day,date:d.date,city:d.city,name,category:category(x.category),cost:n(x.cost),sort_order:i,dayIndex})})});return rows}function totalRows(rows){return rows.reduce((s,x)=>s+n(x.cost),0)}function totals(){const day=list().reduce((s,x)=>s+n(x.cost),0),rows=expenseRows(),trip=totalRows(rows);q('#expenseDayTotal').textContent=money(day);q('#expenseTripTotal').textContent=money(trip);if(!billView.classList.contains('is-hidden'))renderBill()}
function billLine(row,meta){return `<div class="bill-line"><div class="bill-line-main"><div class="bill-line-name">${safe(row.name)}</div><div class="bill-line-meta">${safe(meta)}</div></div><div class="bill-line-cost">${money(row.cost)}</div></div>`}function billSection(title,subtitle,rows,meta){return `<section class="bill-section"><div class="bill-section-title"><span>${safe(title)}${subtitle?` · ${safe(subtitle)}`:''}</span><strong>${money(totalRows(rows))}</strong></div>${rows.map(r=>billLine(r,meta(r))).join('')}</section>`}function renderBill(){const rows=expenseRows();q('#billTripTotal').textContent=money(totalRows(rows));billByDayBtn.classList.toggle('active',billMode==='day');billByCategoryBtn.classList.toggle('active',billMode==='category');if(!rows.length){q('#billContent').innerHTML='<div class="bill-empty">当前还没有费用记录</div>';return}if(billMode==='category'){q('#billContent').innerHTML=CATEGORIES.map(c=>({category:c,rows:rows.filter(r=>r.category===c).sort((a,b)=>a.dayIndex-b.dayIndex||a.sort_order-b.sort_order)})).filter(g=>g.rows.length).map(g=>billSection(g.category,'',g.rows,r=>`${r.date} · ${r.day} · ${r.city}`)).join('');return}q('#billContent').innerHTML=DAYS.map(d=>({day:d,rows:rows.filter(r=>r.day===d.day)})).filter(g=>g.rows.length).map(g=>billSection(g.day.date,g.day.city,g.rows,r=>`${r.day} · ${r.category}`)).join('')}function showBill(open){expenseView.classList.toggle('bill-open',open);billView.classList.toggle('is-hidden',!open);strip.classList.toggle('is-hidden',open);if(open){editing=false;deletedIds=[];renderBill();billView.scrollIntoView({behavior:'smooth',block:'start'})}}
function renderExpense(){const d=DAYS[selectedIndex],rows=list();q('#expenseDayLabel').textContent=d.day;q('#expenseDateTitle').textContent=d.date;q('#expenseCity').textContent=d.city;editSaveBtn.textContent=editing?'保存':'编辑';if(!rows.length){q('#expenseList').innerHTML='<div class="expense-empty">当天还没有费用记录</div>'}else if(!editing){q('#expenseList').innerHTML=rows.map(x=>`<div class="expense-row"><div class="expense-name-wrap"><div class="expense-name">${safe(x.name||'未命名项目')}</div><span class="expense-category" data-category="${attr(category(x.category))}">${safe(category(x.category))}</span></div><div class="expense-cost">${money(x.cost)}</div></div>`).join('')}else{q('#expenseList').innerHTML=rows.map(x=>`<div class="expense-row editing" draggable="true" data-id="${attr(x.id)}"><button class="expense-drag" type="button" aria-label="拖拽排序">≡</button><input class="expense-input expense-name-input" value="${attr(x.name)}" placeholder="项目"><select class="expense-input expense-category-input" aria-label="分类">${categoryOptions(x.category)}</select><input class="expense-input expense-cost-input" type="number" inputmode="decimal" min="0" step="0.01" value="${attr(x.cost)}" placeholder="0"><button class="expense-delete" type="button" aria-label="删除">×</button></div>`).join('');bindRows()}totals()}
function bindRows(){document.querySelectorAll('.expense-row.editing').forEach(row=>{const rowId=row.dataset.id;row.querySelector('.expense-name-input').addEventListener('input',e=>{const x=list().find(v=>v.id===rowId);if(x)x.name=e.target.value});row.querySelector('.expense-category-input').addEventListener('change',e=>{const x=list().find(v=>v.id===rowId);if(x)x.category=category(e.target.value)});row.querySelector('.expense-cost-input').addEventListener('input',e=>{const x=list().find(v=>v.id===rowId);if(x)x.cost=e.target.value;totals()});row.querySelector('.expense-delete').addEventListener('click',()=>{if(!confirm('删除这个费用项目？'))return;if(rowId)deletedIds.push(rowId);expenses[key()]=list().filter(v=>v.id!==rowId);renderExpense()});row.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',rowId);e.dataTransfer.effectAllowed='move'});row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain'),arr=list().slice(),fi=arr.findIndex(v=>v.id===from),ti=arr.findIndex(v=>v.id===rowId);if(fi<0||ti<0||fi===ti)return;const moved=arr.splice(fi,1)[0];arr.splice(ti,0,moved);expenses[key()]=arr;renderExpense()})})}
async function saveCurrentDay(){const day=key(),rows=list();editSaveBtn.disabled=true;try{for(const id of [...new Set(deletedIds)])await api('DELETE',{id});deletedIds=[];for(let i=0;i<rows.length;i++){const x=rows[i];await api('PATCH',{id:x.id,item_name:String(x.name||'').trim()||'未命名项目',amount:n(x.cost),category:category(x.category),sort_order:i})}if(rows.length)await api('POST',{action:'reorder',day_key:day,ordered_ids:rows.map(x=>x.id)});cache();await fetchCloud(false);toast('已同步到云端');return true}catch(e){cache();toast('同步失败，修改已保留在本机');return false}finally{editSaveBtn.disabled=false}}
function setMode(mode){const expense=mode==='expense';tripTab.classList.toggle('active',!expense);expenseTab.classList.toggle('active',expense);shell.classList.toggle('is-hidden',expense);expenseView.classList.toggle('is-hidden',!expense);editing=false;deletedIds=[];showBill(false);if(expense){renderExpense();initialSync()}}
tripTab.addEventListener('click',()=>setMode('trip'));expenseTab.addEventListener('click',()=>setMode('expense'));billOpenBtn.addEventListener('click',()=>showBill(true));billBackBtn.addEventListener('click',()=>showBill(false));billByDayBtn.addEventListener('click',()=>{billMode='day';renderBill()});billByCategoryBtn.addEventListener('click',()=>{billMode='category';renderBill()});document.querySelectorAll('.dbtn').forEach((b,i)=>{b.addEventListener('click',()=>{selectedIndex=i;editing=false;deletedIds=[];if(!expenseView.classList.contains('is-hidden'))renderExpense()})});editSaveBtn.addEventListener('click',async()=>{if(!editing){editing=true;deletedIds=[];renderExpense();return}const ok=await saveCurrentDay();if(ok){editing=false;renderExpense()}});addBtn.addEventListener('click',()=>{newName.value='';newCategory.value='其他';newCost.value='';q('#expenseModalDate').textContent=DAYS[selectedIndex].date+' · '+DAYS[selectedIndex].city;modal.classList.remove('is-hidden');setTimeout(()=>newName.focus(),0)});q('#expenseCancelBtn').addEventListener('click',()=>modal.classList.add('is-hidden'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('is-hidden')});form.addEventListener('submit',async e=>{e.preventDefault();const name=newName.value.trim(),cat=category(newCategory.value),cost=newCost.value.trim();if(!name){newName.focus();return}const submit=form.querySelector('button[type="submit"]');submit.disabled=true;try{const data=await api('POST',{day_key:key(),item_name:name,amount:n(cost),category:cat,sort_order:list().length});const r=data.expense||{},arr=list().slice();arr.push({id:r.id,name:r.item_name||name,cost:String(r.amount??cost),category:category(r.category||cat),sort_order:r.sort_order??arr.length});expenses[key()]=arr;cache();modal.classList.add('is-hidden');renderExpense();toast('已同步到云端')}catch(err){toast('新增失败，请检查网络后重试')}finally{submit.disabled=false}});renderExpense();if(document.documentElement.classList.contains('auth-ok'))initialSync();window.addEventListener('trip-auth-ready',()=>initialSync())})();
</script>
<script id="site-auth-script">
(function(){var API='https://dncezupptrncranshvon.supabase.co/functions/v1/trip-expenses',SESSION_KEY='us-trip-2026-session',form=document.getElementById('siteAuthForm'),input=document.getElementById('siteAuthPassword'),error=document.getElementById('siteAuthError'),button=form.querySelector('button[type="submit"]');function unlock(){document.documentElement.classList.remove('auth-locked');document.documentElement.classList.add('auth-ok');document.body.style.overflow='';window.dispatchEvent(new Event('trip-auth-ready'))}if(document.documentElement.classList.contains('auth-ok')){window.dispatchEvent(new Event('trip-auth-ready'));return}form.addEventListener('submit',async function(e){e.preventDefault();var password=input.value;if(!password)return;error.textContent='';button.disabled=true;try{var res=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-trip-password':password},body:JSON.stringify({action:'verify'})});var data={};try{data=await res.json()}catch(_){}if(!res.ok||!data.session)throw new Error('auth');try{localStorage.setItem(SESSION_KEY,data.session);localStorage.removeItem('us-trip-2026-auth')}catch(_){}input.value='';unlock()}catch(err){error.textContent='密码不正确，或网络暂时无法连接。';input.value='';input.focus()}finally{button.disabled=false}});setTimeout(function(){input.focus()},0)})();
</script>
